# main への PR で走る唯一の自動チェック。データのダウンロードはしない (トークンも要らない)。
name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:      # 手動実行 (Actions タブから)

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install jpholiday      # 日本の祝日判定 (scripts/Japan/classify.py) にだけ要る
      - name: Unit tests
        run: python -m unittest discover -s scripts/test -v
