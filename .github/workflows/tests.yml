# The only automated check that runs on PRs to main. Downloads no data (and needs no token).
name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:      # manual run (from the Actions tab)

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install jpholiday      # only needed for Japanese holiday detection (scripts/Japan/classify.py)
      - name: Unit tests
        run: python -m unittest discover -s scripts/test -v
